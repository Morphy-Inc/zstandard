name: zstandard
publish_to: none
description: "Flutter plugin to implement Zstandard compression"
version: 1.5.0

homepage: https://vyp.dev
repository: https://github.com/vypdev/zstandard

environment:
  sdk: ^3.6.0
  flutter: '>=3.3.0'

flutter:
  plugin:
    platforms:
      android:
        default_package: zstandard_android
      ios:
        default_package: zstandard_ios
      linux:
        default_package: zstandard_linux
      macos:
        default_package: zstandard_macos
      web:
        default_package: zstandard_web
      windows:
        default_package: zstandard_windows

dependencies:
  flutter:
    sdk: flutter
  zstandard_android:
    path: ../zstandard_android
  zstandard_ios:
    path: ../zstandard_ios
  zstandard_linux:
    path: ../zstandard_linux
  zstandard_macos:
    path: ../zstandard_macos
  zstandard_platform_interface:
    path: ../zstandard_platform_interface
  zstandard_web:
    path: ../zstandard_web
  zstandard_windows:
    path: ../zstandard_windows

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  kiri_check: ^1.3.1
  mockito: ^5.4.4
  mutation_test: ^1.8.0
  plugin_platform_interface: ^2.1.8
  test: ^1.16.3
